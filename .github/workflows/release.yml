name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Universal
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release metadata
        run: python3 scripts/check_release.py
      - name: Build Apple Silicon and Intel app
        env:
          DESKTOP_DOG_ARCHS: arm64 x86_64
        run: ./scripts/build.sh
      - name: Native app checks
        timeout-minutes: 5
        run: '"build/바탕화면 강아지.app/Contents/MacOS/DesktopDog" --self-test --character bonobono --character-window-check --cursor-window-check --creator-window-check --collection-window-check'
      - name: Package and validate
        run: |
          python3 scripts/package_macos.py
          python3 scripts/check_release.py --archives dist/DesktopCharacter-*-macOS-Universal.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/DesktopCharacter-*-macOS-Universal.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned dependencies
        run: python -m pip install -r windows/requirements.txt pyinstaller==6.22.3
      - name: Source checks and native Win32 diagnosis
        run: |
          python scripts/check_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/launch.py --self-test --validate-assets --widget-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/launch.py --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable EXE
        run: python windows/build.py
      - name: Test the packaged EXE
        timeout-minutes: 5
        run: |
          $exe = Join-Path $PWD 'dist/windows/DesktopCharacter/DesktopCharacter.exe'
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test --validate-assets --widget-check --check-report .build/frozen-checks.log' -WorkingDirectory $PWD -Wait -PassThru
          if (Test-Path .build/frozen-checks.log) { Get-Content .build/frozen-checks.log }
          if ($test.ExitCode -ne 0) { throw "Packaged EXE checks failed: $($test.ExitCode)" }
          $diagnose = Start-Process -FilePath $exe -ArgumentList '--diagnose --check-report .build/frozen-diagnosis.log' -WorkingDirectory $PWD -Wait -PassThru
          if (Test-Path .build/frozen-diagnosis.log) { Get-Content .build/frozen-diagnosis.log }
          if ($diagnose.ExitCode -ne 0) { throw "Packaged Win32 diagnosis failed: $($diagnose.ExitCode)" }
          python scripts/check_release.py --archives dist/DesktopCharacter-1.0.0-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/DesktopCharacter-*-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Validate tag, archives and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 scripts/check_release.py --archives dist/*.zip
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "DesktopCharacter $VERSION" --notes-file "../docs/releases/$VERSION.md"
